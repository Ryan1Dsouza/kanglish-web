<details class="card" id="create-dictionary-panel"><summary>Create a dictionary</summary>
  <div class="dictionary-form">
    <label>Name<input id="new-dictionary-name" maxlength="80" placeholder="My travel phrases"></label>
    <label>From<select id="new-dictionary-source"></select></label>
    <label>To<select id="new-dictionary-target"></select></label>
    <button id="create-dictionary" class="primary compact" type="button">Create dictionary</button>
  </div>
  <p class="subtle">Choose different source and target languages. Empty dictionaries are saved in your account. Your account can store up to 10 dictionaries.</p>
</details>

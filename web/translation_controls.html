<div class="language-controls">
  <label for="source-language">From<select id="source-language" aria-label="Source language"></select></label>
  <button id="swap-languages" type="button" aria-label="Swap languages" title="Swap languages">⇄</button>
  <label for="target-language">To<select id="target-language" aria-label="Target language"></select></label>
  <span class="subtle" id="selected-direction"></span>
</div>
<p class="subtle">Kanglish and Tuluglish use English letters. Kannada and Tulu use Kannada script. Text and submitted recordings are sent to Google for translation.</p>
